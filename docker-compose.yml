# docker-compose.yml — Postgres local para desenvolvimento do OpsPilot (requer Docker).
# Em produção não usamos Docker: API e Web rodam nativos no Render.
# Uso: docker compose up -d  ->  Postgres em localhost:5432 (bate com apps/api/.env.example)
services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - opspilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opspilot-pgdata:
