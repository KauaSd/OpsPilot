databases:
  - name: opspilot-db
    databaseName: opspilot
    user: opspilot
    plan: free
    region: oregon

services:
  - type: web
    name: opspilot-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @opspilot/api exec prisma generate && pnpm --filter @opspilot/api build
    startCommand: pnpm --filter @opspilot/api exec prisma migrate deploy && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT_MS
        value: "25000"
      - key: PROMPT_VERSION
        value: v1
      - key: WEB_ORIGIN
        sync: false
      # Google OAuth 2.0 (login com Google normal). Crie um OAuth Client
      # (Web) em console.cloud.google.com e preencha no painel do Render.
      # redirect URI: https://opspilot-web-2612.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: opspilot-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @opspilot/web build
    startCommand: pnpm --filter @opspilot/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      # URL pública da API. O BFF chama a API server-side; `fromService property: host`
      # devolve o host da rede PRIVADA (inválido para HTTPS público), por isso usamos a URL pública.
      # Se recriar o serviço da API, atualize este valor (ou defina manualmente no painel do Render).
      - key: API_URL
        value: https://opspilot-api-4vmt.onrender.com/api/v1
      # Google OAuth: client ID (público) usado pelo BFF para iniciar o fluxo.
      # O Client Secret fica apenas na API. redirect URI:
      # https://opspilot-web-2612.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
